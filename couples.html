        /* Critical above-the-fold CSS */
        /* Get rid of all padding and margin */
        body {
          background:var(--cream);

        .hero-section {

        .hero-overlay {
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.1); /* 25% transparent black */
            display: flex;
            flex-direction: column;
            text-align: center;
            color: white;
        }

        .brand-pill {
        z-index:2;
        padding:12px 36px;
        border-radius:4px;
        margin:100px 5vw 0;        /* centred top     */
        width:max-content;          /* shrink-wrap     */
        
    }

      .brand-pill img {
          height: 75px;

      }

      @media (max-width: 700px){
          .brand-pill img {
          height: 60px;

      }

      .center-aligned{
                padding:0 5vw;         /* 5 % of the viewport on each side */
                top: 60%;
            }

            .hero-section {background-position: 49% center;}

  }

  .center-aligned {
            z-index: 2;
            font-family: var(--headline);
            color: var(--cream);
            font-size:clamp(40px, 7vw, 100px);   /*clamp(50px ,10vw , 150px);*/
            max-width:90vw;          /* prevents words spilling outside the screen */
            padding:0;           /* gives a little breathing room on small viewports */
            position: absolute;
            top: 60%; /* Adjust this value to control the height from the top */
            left: 50%;
            transform: translate(-50%, -50%); /* Centers the text horizontally and vertically */
            text-align: center;
        }

        .center-aligned div {
            line-height: 0.9; /* Adjust line height as needed */
        }

        /* Gallery skeleton loading */
        .gallery-section {
            display: flex;
            flex-wrap: wrap;
            gap: 70px;
            padding: 0 40px;
            min-height: 100vh;
        }

        .gallery-section img {
            height: 400px;
            width: auto;
            flex: 0 0 auto;
            object-fit: cover;
            display: block;
            background: var(--cream);
            cursor: pointer; /* shows hand cursor */
        }

        /* Row-fade effect */
        .gallery-section img.row-hidden {
            opacity: 0;
            transform: translateY(40px);
            filter: brightness(1);
        }

        .gallery-section img.row-visible {
            opacity: 1;
            transform: translateY(0);
            filter: brightness(1);
            transition: opacity .8s ease-out,
                        transform .8s ease-out,
                        filter .8s ease-out;
        }

/* Lightbox overlay */
.lightbox {
  position: fixed;
  z-index: 1000;
  inset: 0; /* shorthand for top/left/right/bottom = 0 */
  background-color: rgba(255,255,255,0.95); /* translucent white background */

  display: none;             /* hidden by default */
  align-items: center;       /* vertical centering (when shown) */
  justify-content: center;   /* horizontal centering */
  overflow: hidden;
}

.lightbox.show {             /* toggle this class in JS instead of inline display=block */
  display: flex;
}

.lightbox img.lightbox-img {
  max-width: 90%;
  max-height: 90vh;   /* keeps image within viewport */
  object-fit: contain;
  background: white;  /* fade-through-white works */
  transition: opacity 0.4s ease;
  border-radius: 4px;
  z-index: 10;
}

/* Arrows */
.lightbox .prev,
.lightbox .next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  font-weight: bold;
  color: #000;
  padding: 16px;
  cursor: pointer;
  user-select: none;
  z-index: 20;
}
.lightbox .prev { left: 20px; }
.lightbox .next { right: 20px; }

.lightbox .prev:hover,
.lightbox .next:hover {
  color: #555;
}

/* Close button */
.lightbox .close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  font-weight: bold;
  color: #000;
  cursor: pointer;
  z-index: 30;
}

        // Progressive image loading with intersection observer
        class ProgressiveGallery {
            constructor() {
                this.gallery = document.getElementById('gallery');
                this.loadedImages = new Set();
                this.imageElements = [];
                this.BATCH_SIZE = 20; // Load 20 images at a time
                this.currentBatch = 0;
                
                // Gallery layout constants
                this.GAP = 70;
                this.SIDE = 40;
                this.ROW_H = 400;
                
                this.init();
            }

            init() {
                // Load first batch immediately
                this.loadBatch();
                
                // Set up scroll observer for loading more images
                this.setupScrollObserver();
                
                // Set up resize handler
                this.setupResizeHandler();
            }

            loadBatch() {
                const start = this.currentBatch * this.BATCH_SIZE;
                const end = Math.min(start + this.BATCH_SIZE, imageList.length);
                
                for (let i = start; i < end; i++) {
                    if (!this.loadedImages.has(i)) {
                        this.createImage(imageList[i], i);
                        this.loadedImages.add(i);
                    }
                }
                
                this.currentBatch++;
                
                // After images are added, relayout
                requestAnimationFrame(() => this.layout());
            }

            createImage(imageData, index) {
                const img = new Image();
                img.loading = index < 10 ? 'eager' : 'lazy'; // First 10 eager, rest lazy
                img.decoding = 'async';
                img.src = imageData.src;
                img.alt = imageData.alt;
                img.className = 'row-hidden';
                
                this.gallery.appendChild(img);
                this.imageElements.push(img);
                
                // Preload next image dimensions for smooth layout
                if (index < imageList.length - 1) {
                    const nextImg = new Image();
                    nextImg.src = imageList[index + 1].src;
                }
            }

            layout() {
                const pics = this.imageElements.filter(img => img.complete && img.naturalWidth > 0);
                if (pics.length === 0) return;
                
                const usable = this.gallery.clientWidth - this.SIDE * 2;
                let row = [], rowSumW = 0;

                pics.forEach(pic => {
                    const w = (pic.naturalWidth / pic.naturalHeight) * this.ROW_H;
                    
                    row.push({ pic, w });
                    rowSumW += w;
                    
                    const totalWithGaps = rowSumW + this.GAP * (row.length - 1);
                    
                    if (totalWithGaps >= usable) {
                        const scale = (usable - this.GAP * (row.length - 1)) / rowSumW;
                        
                        row.forEach(({ pic, w }) => {
                            pic.style.width = (w * scale) + 'px';
                            pic.style.height = (this.ROW_H * scale) + 'px';
                        });
                        
                        row.length = 0;
                        rowSumW = 0;
                    }
                });
                
                // Build row observer after layout
                this.buildRowObserver();
            }

            buildRowObserver() {
                if (this.rowObserver) this.rowObserver.disconnect();
                
                const rows = {};
                this.imageElements.forEach(pic => {
                    if (!pic.offsetTop) return;
                    const top = pic.offsetTop;
                    (rows[top] ??= []).push(pic);
                });
                
                this.rowObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const rowTop = entry.target.offsetTop;
                            if (rows[rowTop]) {
                                rows[rowTop].forEach(p => {
                                    p.classList.remove('row-hidden');
                                    p.classList.add('row-visible');
                                });
                            }
                            this.rowObserver.unobserve(entry.target);
                        }
                    });
                }, { 
                    root: null, 
                    threshold: 0.1,
                    rootMargin: '100px' // Start loading 100px before visible
                });
                
                Object.values(rows).forEach(rowPics => {
                    if (rowPics[0]) this.rowObserver.observe(rowPics[0]);
                });
            }

            setupScrollObserver() {
                const sentinel = document.createElement('div');
                sentinel.style.height = '1px';
                this.gallery.parentElement.appendChild(sentinel);
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && this.currentBatch * this.BATCH_SIZE < imageList.length) {
                            this.loadBatch();
                        }
                    });
                }, {
                    rootMargin: '500px' // Load more when 500px from bottom
                });
                
                observer.observe(sentinel);
            }

            setupResizeHandler() {
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => this.layout(), 250);
                });
                
                // Also layout when images load
                this.gallery.addEventListener('load', (e) => {
                    if (e.target.tagName === 'IMG') {
                        requestAnimationFrame(() => this.layout());
                    }
                }, true);
            }
        }

        // Initialize gallery when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new ProgressiveGallery());
        } else {
            new ProgressiveGallery();
        }

        // Defer loading nav.js
        const navScript = document.createElement('script');
        navScript.src = 'js/nav.js';
        navScript.defer = true;
        document.body.appendChild(navScript);
    </script>

  <!-- Lightbox javascript -->
<script>
  let currentIndex = 0;

  function openLightbox(index) {
  currentIndex = index;
  const lightbox = document.getElementById("lightbox");
  const img = lightbox.querySelector(".lightbox-img");
  img.src = imageList[currentIndex].src;
  img.alt = imageList[currentIndex].alt;
  lightbox.classList.add("show");   // ✅ use class
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("show");  // ✅ use class
}

  function changeSlide(step) {
  const img = document.querySelector(".lightbox-img");

  // Fade out (to white)
  img.style.opacity = "0";

  setTimeout(() => {
    currentIndex = (currentIndex + step + imageList.length) % imageList.length;
    img.src = imageList[currentIndex].src;
    img.alt = imageList[currentIndex].alt;

    // Fade in
    img.onload = () => {
      img.style.opacity = "1";
    };
  }, 250); // delay matches fade-out duration
}



  // Attach listeners once gallery is loaded
  document.addEventListener("DOMContentLoaded", () => {
    const gallery = document.getElementById("gallery");
    gallery.addEventListener("click", (e) => {
      if (e.target.tagName === "IMG") {
        const index = Array.from(gallery.querySelectorAll("img")).indexOf(e.target);
        openLightbox(index);
      }
    });

    document.querySelector(".lightbox .close").onclick = closeLightbox;
    document.querySelector(".lightbox .prev").onclick = () => changeSlide(-1);
    document.querySelector(".lightbox .next").onclick = () => changeSlide(1);

    // Close on background click
    document.getElementById("lightbox").addEventListener("click", (e) => {
      if (e.target.id === "lightbox") closeLightbox();
    });

    // Keyboard controls
    document.addEventListener("keydown", (e) => {
      const lightbox = document.getElementById("lightbox");
      if (lightbox.style.display === "block") {
        if (e.key === "ArrowRight") changeSlide(1);
        if (e.key === "ArrowLeft") changeSlide(-1);
        if (e.key === "Escape") closeLightbox();
      }
    });
  });
</script>
    
  <script src="js/nav.js"></script>

      <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <div class="lightbox-overlay"></div> <!-- NEW overlay -->
    <img class="lightbox-img" src="" alt="">
    <a class="prev">&#10094;</a>
    <a class="next">&#10095;</a>
  </div>
